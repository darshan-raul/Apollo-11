name: CI

# Stage 5 CI: lint + validate the Helm chart and Kustomize overlays, build
# container images, and push to GHCR on main / tag events.
#
# The Stage 5 Argo CD module handles deployment. This workflow is
# intentionally CD-light: we don't auto-deploy from CI.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR package paths must be lowercase. Keep this aligned with values-prod.yaml.
  IMAGE_PREFIX: darshan-raul/apollo11

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + validate packaging
  # ---------------------------------------------------------------------------
  lint:
    name: Helm + Kustomize validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: helm lint (all environments)
        working-directory: stages/stage5
        run: |
          helm lint helm/apollo11
          for env in dev staging prod; do
            helm lint helm/apollo11 -f "helm/apollo11/values-${env}.yaml"
          done

      - name: helm template (smoke render)
        working-directory: stages/stage5
        run: |
          helm template apollo11 helm/apollo11 > /tmp/stage5-render.yaml
          count=$(grep -c '^kind:' /tmp/stage5-render.yaml)
          test "$count" -gt 100
          echo "Resources rendered with bundled controllers: $count"

      - name: committed Kustomize base matches the verified chart
        working-directory: stages/stage5
        run: |
          helm template apollo11 helm/apollo11 \
            --namespace apollo-airlines-apps \
            --set gateway.envoy.bundleInstall=false \
            --set metallb.bundleInstall=false \
            --set pdb.enabled=false > /tmp/stage5-plain-base.yaml
          tail -n +4 overlays/base/generated.yaml > /tmp/stage5-committed-base.yaml
          diff -u /tmp/stage5-plain-base.yaml /tmp/stage5-committed-base.yaml

      - name: kustomize build (all environments)
        working-directory: stages/stage5
        run: |
          for env in dev staging prod; do
            kubectl kustomize "overlays/${env}" > "/tmp/stage5-kustomize-${env}.yaml"
          done
          test "$(grep -c '^kind:' /tmp/stage5-kustomize-dev.yaml)" -eq 61
          test "$(grep -c '^kind:' /tmp/stage5-kustomize-staging.yaml)" -eq 61
          test "$(grep -c '^kind:' /tmp/stage5-kustomize-prod.yaml)" -eq 63

      - name: shellcheck scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck stages/stage5/scripts/*.sh
          shellcheck stages/stage5/argocd/*.sh stages/stage5/argocd/scripts/*.sh

      - name: validate isolated Argo CD Applications
        run: bash stages/stage5/argocd/scripts/validate.sh

  # ---------------------------------------------------------------------------
  # 2. Build container images (matrix, no push on PRs)
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - flight
          - booking
          - search
          - notification
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract VITE_* URLs for frontend build
        id: vite
        if: matrix.service == 'frontend'
        run: |
          CHART=stages/stage5/helm/apollo11/values.yaml
          read_url() { awk -v key="$1" '/^  viteUrls:/ { found=1; next } found && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }' "$CHART"; }
          echo "vite_id=$(read_url identity)" >> "$GITHUB_OUTPUT"
          echo "vite_fl=$(read_url flight)" >> "$GITHUB_OUTPUT"
          echo "vite_bk=$(read_url booking)" >> "$GITHUB_OUTPUT"
          echo "vite_sr=$(read_url search)" >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: stages/stage5/code/${{ matrix.service }}
          file: stages/stage5/code/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            VITE_IDENTITY_URL=${{ steps.vite.outputs.vite_id }}
            VITE_FLIGHT_URL=${{ steps.vite.outputs.vite_fl }}
            VITE_BOOKING_URL=${{ steps.vite.outputs.vite_bk }}
            VITE_SEARCH_URL=${{ steps.vite.outputs.vite_sr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Push to GHCR (only on main push or tag)
  # ---------------------------------------------------------------------------
  push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - flight
          - booking
          - search
          - notification
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract VITE_* URLs for frontend build
        id: vite
        if: matrix.service == 'frontend'
        run: |
          CHART=stages/stage5/helm/apollo11/values.yaml
          read_url() { awk -v key="$1" '/^  viteUrls:/ { found=1; next } found && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }' "$CHART"; }
          echo "vite_id=$(read_url identity)" >> "$GITHUB_OUTPUT"
          echo "vite_fl=$(read_url flight)" >> "$GITHUB_OUTPUT"
          echo "vite_bk=$(read_url booking)" >> "$GITHUB_OUTPUT"
          echo "vite_sr=$(read_url search)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: stages/stage5/code/${{ matrix.service }}
          file: stages/stage5/code/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_IDENTITY_URL=${{ steps.vite.outputs.vite_id }}
            VITE_FLIGHT_URL=${{ steps.vite.outputs.vite_fl }}
            VITE_BOOKING_URL=${{ steps.vite.outputs.vite_bk }}
            VITE_SEARCH_URL=${{ steps.vite.outputs.vite_sr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
