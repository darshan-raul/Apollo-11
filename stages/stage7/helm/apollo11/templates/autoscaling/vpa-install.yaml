Stage 7: VerticalPodAutoscaler install (bundled for offline-friendly installs).

Stage 7 installs two upstream controllers in `kube-system`:
  * recommender — observes metrics, computes recommendations
  * updater     — observes update policy (a no-op for our Off-mode VPA)

The admission controller is intentionally omitted: Off mode does not mutate
pods, so a TLS webhook would add cost and failure modes without being used.
The bundle is curated from kubernetes/autoscaler v1.7.0.

Set `.Values.vpa.bundleInstall = false` to skip.
