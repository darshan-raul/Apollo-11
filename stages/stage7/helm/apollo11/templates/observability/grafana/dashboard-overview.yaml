{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overview
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: apollo-airlines
    grafana_dashboard: "1"
data:
  dashboard.json: '{"editable":true,"uid":"apollo-overview","title":"Apollo Overview","tags":["apollo"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"30s","time":{"from":"now-1h","to":"now"},"panels":[{"id":1,"type":"stat","title":"Backend targets up","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":4,"w":8,"x":0,"y":0},"targets":[{"expr":"count(up{namespace=\"{{ .Values.namespaces.apps }}\"} == 1)","refId":"A"}]},{"id":2,"type":"timeseries","title":"Requests/sec by service","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"sum by (service) (rate(http_requests_total[5m]))","refId":"A"}]},{"id":3,"type":"timeseries","title":"p95 latency by service","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"expr":"histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_ms_bucket[5m])))","refId":"A"}]}]}'

{{- end }}
