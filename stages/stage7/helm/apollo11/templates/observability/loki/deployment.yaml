{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Values.observability.namespace }}
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: apollo-airlines }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: apollo-airlines }
    spec:
      serviceAccountName: observability-stack
      terminationGracePeriodSeconds: 60
      containers:
        - name: loki
          image: {{ .Values.observability.loki.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { name: http, containerPort: 3100, protocol: TCP }
            - { name: grpc, containerPort: 9096, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /var/loki }
          resources:
            {{- toYaml .Values.observability.loki.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: {{ .Values.observability.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.observability.loki.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.observability.namespace }}
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: apollo-airlines }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports:
    - { name: http, port: 3100, targetPort: http }
    - { name: grpc, port: 9096, targetPort: grpc }

{{- end }}
