---
# Dev environment overrides — minimal footprint for local iteration.
# Use as: helm upgrade --install apollo11 helm/apollo11 -f values-dev.yaml

image:
  # CI publishes :latest on main and immutable :sha-* tags.
  tag: latest

apps:
  identity:
    replicas: 1
  flight:
    replicas: 1
  booking:
    replicas: 1
  search:
    replicas: 1
  notification:
    replicas: 1

frontend:
  replicas: 1

# PodDisruptionBudgets off in dev — we want fast teardowns.
pdb:
  enabled: false

# Stage 7: cheaper autoscaling in dev. min=1 so we don't burn resources
# on a local kind cluster. VPA is off in dev — its recommender/updater
# controllers add resource cost without enough history to be useful.
autoscaling:
  search:
    minReplicas: 1
    maxReplicas: 3
vpa:
  search:
    enabled: false
