apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: apollo-airlines-ui
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: flight
  namespace: apollo-airlines-apps
spec:
  type: NodePort
  selector:
    app: flight
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: apollo-airlines-apps
spec:
  type: NodePort
  selector:
    app: booking
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: apollo-airlines-apps
spec:
  type: NodePort
  selector:
    app: identity
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: apollo-airlines-apps
spec:
  type: NodePort
  selector:
    app: search
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30084
