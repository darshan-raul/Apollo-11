{{- if .Values.observability.enabled }}
# Cross-namespace HTTPRoute: Grafana in apollo-observability, served via
# the Envoy Gateway in apollo-airlines-apps. The Gateway listener permits
# routes from all namespaces, and the backend Service is local to this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: apollo-airlines
spec:
  parentRefs:
    - name: apollo-gateway
      namespace: {{ .Values.namespaces.apps }}
  hostnames:
    - "grafana.apollo.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000

{{- end }}
