{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-saturation
  namespace: {{ .Values.observability.namespace }}
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: apollo-airlines }
data:
  dashboard.json: '{"editable":true,"uid":"apollo-runtime","title":"Service Runtime","tags":["apollo"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"30s","time":{"from":"now-1h","to":"now"},"panels":[{"id":1,"type":"timeseries","title":"Process CPU by target","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":10,"w":12,"x":0,"y":0},"targets":[{"expr":"sum by (job) (rate(process_cpu_seconds_total[5m]))","refId":"A"}]},{"id":2,"type":"timeseries","title":"Resident memory by target","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":10,"w":12,"x":12,"y":0},"targets":[{"expr":"sum by (job) (process_resident_memory_bytes)","refId":"A"}]}]}'
{{- end }}
