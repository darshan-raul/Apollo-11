{{- if .Values.observability.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apollo-services
  namespace: {{ .Values.observability.namespace }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: apollo-airlines
spec:
  groups:
    - name: apollo.availability
      interval: 30s
      rules:
        - alert: ApolloServiceDown
          expr: up{namespace="{{ .Values.namespaces.apps }}"} == 0
          for: 2m
          labels: { severity: critical, team: platform }
          annotations:
            summary: Apollo backend metrics target is down
        - alert: ApolloServiceFlapping
          expr: changes(up{namespace="{{ .Values.namespaces.apps }}"}[10m]) > 6
          labels: { severity: warning, team: platform }
          annotations:
            summary: Apollo backend metrics target is flapping
    - name: apollo.http
      interval: 30s
      rules:
        - alert: ApolloErrorRateHigh
          expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: Apollo backend 5xx rate exceeds 5 percent
        - alert: ApolloBookingLatencyP95High
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket{service="booking"}[5m]))) > 500
          for: 5m
          labels: { severity: warning, team: platform, service: booking }
          annotations:
            summary: Booking p95 latency exceeds 500 milliseconds

{{- end }}
