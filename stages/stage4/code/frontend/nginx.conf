worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Stage 4: distinct probe endpoints for kubelet
        location = /healthz/startup {
            access_log off;
            default_type text/plain;
            return 200 "starting";
        }

        location = /healthz/live {
            access_log off;
            default_type text/plain;
            return 200 "alive";
        }

        location = /healthz/ready {
            access_log off;
            default_type text/plain;
            return 200 "ready";
        }

        # Legacy probe endpoints for backward-compatibility
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /readyz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /metrics {
            access_log off;
            default_type 'text/plain; version=0.0.4';
            return 200 '# HELP http_requests_total Total HTTP requests observed by the service.\n# TYPE http_requests_total counter\nhttp_requests_total{service="frontend"} 0\n# HELP http_request_duration_ms Most recently observed request duration in milliseconds.\n# TYPE http_request_duration_ms gauge\nhttp_request_duration_ms{service="frontend"} 0\n# HELP db_connections_active Active database connections owned by the service.\n# TYPE db_connections_active gauge\ndb_connections_active{service="frontend"} 0\n';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
